[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "wcb-trubot"
version = "2.1.0"
description = "A small, production-grade Discord home for Trubot."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Will Carter Bowl League of Champions" }]
dependencies = [
  "discord.py>=2.7,<3",
  "openai>=3.5,<4",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
trubot = "trubot.app:main"
trubot-healthcheck = "trubot.health:main"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trubot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The personality corpus preserves the authors' original Unicode punctuation.
"src/trubot/personality.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
  "--cov=trubot",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:discord.player",
]

[tool.coverage.run]
source = ["trubot"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src"]
